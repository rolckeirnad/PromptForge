name: Code Review

on:
  pull_request:
    types: [ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    if: >
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/gemini-review') &&
       github.event.comment.user.type != 'Bot')
    uses: rolckeirnad/github-actions/.github/workflows/gemini-review.yml@v1.0.0
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      skills: pr-review
      dry_run: true