name: Gemini PR Reviewer

on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read         
  pull-requests: write   
  issues: write          

jobs:
  review:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/gemini-review'))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Run Gemini Review Bot
        uses: jgunnink/gemini-review-bot@v1
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          instructions: |                 
            Be extremely concise. 
            Only flag critical logic bugs, security vulnerabilities, or major performance issues. 
            Do not comment on style, formatting, naming conventions, or documentation. 
            Keep code suggestions brief.